name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /root/log430-labo0
          git pull

      - name: Restart container
        run: |
          cd /root/log430-labo0
          dockerd &
          sleep 2
          docker compose down
          docker compose up -d